name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ORION deps (shared libs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-cicd-pipeline/requirements.txt
      - name: Architecture wiring verification
        run: python scripts/verify_architecture_wiring.py
      - name: Wiring pytest
        run: pytest tests/test_architecture_wiring.py -q

  test:
    needs: wiring
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - canonical
          - orion
          - devops
          - hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r ai-cicd-pipeline/requirements.txt
          python -m pip install -r devops-platform/backend/requirements.txt
          python -m pip install pytest pytest-asyncio httpx

      - name: Canonical pytest
        if: matrix.suite == 'canonical'
        working-directory: backend
        run: pytest tests/ -q --tb=short

      - name: ORION pytest
        if: matrix.suite == 'orion'
        working-directory: ai-cicd-pipeline
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SYNC_DATABASE_URL: sqlite:///:memory:
          PIPELINE_EXECUTOR: inline
          DEPLOY_MODE: simulate
        run: pytest tests/ -q --tb=short

      - name: DevOps pytest
        if: matrix.suite == 'devops'
        working-directory: devops-platform
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SYNC_DATABASE_URL: sqlite:///:memory:
        run: pytest tests/ -q --tb=short

      - name: Hub pytest
        if: matrix.suite == 'hub'
        run: pytest tests/hub/ -q --tb=short

  playwright:
    runs-on: ubuntu-latest
    needs: [wiring, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Hub smoke (offline)
        working-directory: e2e
        run: npx playwright test tests/hub.spec.ts --reporter=line
