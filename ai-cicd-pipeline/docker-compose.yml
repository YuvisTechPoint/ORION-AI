x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aicicd
  SYNC_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aicicd
  REDIS_URL: redis://redis:6379/0
  APP_PORT: "8000"
  STAGING_URL: http://host.docker.internal:8080

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicicd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicicd"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - orion_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - orion_net

  app:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='172.16.0.0/12,127.0.0.1'"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *app-env
    volumes:
      # The deployment agent drives the host Docker daemon to build/run staging containers.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - orion_net

  worker:
    build: .
    command: celery -A app.tasks.pipeline_tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment: *app-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orion_net

  beat:
    build: .
    command: celery -A app.tasks.pipeline_tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orion_net

  flower:
    image: mher/flower:2.0.1
    command: celery --broker=redis://redis:6379/0 flower --port=5555 --url_prefix=flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orion_net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Only the selected site config is mounted: both files define the same upstreams.
      - ./nginx/conf.d/${NGINX_SITE_CONF:-orion_dev.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app
      - flower
    healthcheck:
      # -L -k: in prod mode :80 redirects to :443, which uses a self-signed cert in dev setups
      test: ["CMD-SHELL", "curl -fsSkL http://localhost/api/v1/pipeline/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - orion_net

volumes:
  pgdata:

networks:
  orion_net:
    driver: bridge
