# http-level directives for bare-metal installs (Debian/Ubuntu nginx includes conf.d/*.conf
# inside its stock http block). Mirrors nginx/nginx.conf used by docker compose.
server_tokens off;
client_max_body_size 10M;
client_body_timeout 12s;
client_header_timeout 12s;
send_timeout 10s;

log_format orion_log '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time';
access_log /var/log/nginx/access.log orion_log;

limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
